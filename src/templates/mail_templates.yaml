    2. 접속 URL : https://school.dmy.co.kr/
    3. 선생님 관리자 ID: {{a_id}} / PW: {{a_pw}}
    4. 학생①(2학년) ID : {{s1_id}} / PW : 0000
       학생②(4학년) ID : {{s2_id}} / PW : 0000

