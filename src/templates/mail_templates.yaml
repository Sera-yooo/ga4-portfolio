    T. 02-593-9964

    감사합니다.

contract_notice:
  subject: "📢 [독서화랑] {{sch}} {{tea}} 선생님, 정규 서비스 계정 및 운영 지원 안내"
  body: |
    안녕하세요, {{tea}} 선생님.
    우리 아이들의 즐거운 독서 습관 형성을 돕는 독서화랑 클래스입니다.

    먼저, 아이들의 즐거운 독서 습관 형성을 위해
    {{sch}}에서 독서화랑 클래스를 믿고 도입해 주신 점에 대해 깊은 감사의 말씀을 올립니다. 🙇‍♂️

    이에 따라 바로 이용하실 수 있는 정규 서비스 접속 정보 및 운영 지원 문서를 아래와 같이 안내해 드립니다.

    ✅ [관리 교사 접속 및 권한 안내]
    본 계정은 학교 내의 시스템을 운영하는 관리자 계정입니다.

    1. 접속 주소: https://school.dmy.co.kr/
    2. 이용 기간: {{s_str}} ~ {{e_str}}
    3. 관리자 계정: {{a_id}}
    4. 초기 비밀번호: {{a_pw}} (보안을 위해 첫 접속 후 비밀번호 변경을 권장드립니다. 🔒)

    📍 [관리교사 주요 권한]
    관리 선생님께서는 해당 계정을 통해 선생님 및 학생들의 정보를 관리하실 수 있으며, 각 선생님의 반 배정을 설정하실 수 있습니다.

    📂 [운영 지원 자료]
    {{contract_manual_section}}
    3. 학생 명단: {{student_setup_info}}

    ✨ [특별 지원] 학급 세팅 서비스 안내
    학기 초 바쁘신 일정 중에도 아이들의 독서 교육에 매진하시는 선생님의 노고를 조금이나마 덜어드리고자 합니다.
    추가로 필요한 [선생님 및 학생 명단]을 작성하여 회신해 주시면, 저희가 계정 생성과 반 배정 작업을 진행해 드리겠습니다. 🚀

    [첨부파일]
    {{attachment_text}}

    이용 중 궁금하신 점이나 도움이 필요하신 사항이 있으시면 언제든 편하게 말씀해 주세요.
    선생님의 학급에 즐거운 독서 변화가 시작되기를 응원합니다.

    감사합니다.