# =====================================================================
#  독서화랑 메일/문자 본문 (단일 원천) — 정돈본
#
#  통일 규칙
#   · 여는 인사 : 안녕하세요, {{sch}} {{tea}} 선생님!   (학교명 포함 / 느낌표)
#   · 둘째 줄   : 우리 아이들의 즐거운 독서 습관 형성을 돕는 독서화랑 클래스입니다.
#   · 톤        : 따뜻하고 진심이 느껴지게
#   · 맺음말    : 응원 한 줄 + "감사합니다."
#   · 섹션 제목 : [서비스 접속 정보] / [첨부파일] / [운영 지원 자료] 로 통일
#
#  · 문구가 바뀌면 이 파일만 고치세요. 코드는 건드릴 필요 없습니다.
#  · 최상단 키(trial_mail 등)는 catalog.py 의 template 값과 글자까지 같아야 합니다.
# =====================================================================

# ---------------------------------------------------------------------
# 체험 · 메일   (계정 정보는 항상 TEST 고정)
# ---------------------------------------------------------------------
trial_mail:
  subject: "독서화랑 클래스 체험 안내 드립니다."
  body: |
    안녕하세요, {{sch}} {{tea}} 선생님!
    우리 아이들의 즐거운 독서 습관 형성을 돕는 독서화랑 클래스입니다.

    독서화랑 클래스 체험을 신청해 주셔서 진심으로 감사드립니다.
    원활한 체험을 위해 아래 정보를 확인해 주세요.

    [서비스 접속 정보]
    1. 체험 기간: {{s_str}} ~ {{e_str}}
    2. 접속 주소: https://school.dmy.co.kr/
    3. 선생님 관리자 ID: TEST011@dmy.com / PW: 0000
    4. 학생 ①(2학년) ID: TEST01-0001 / PW: 0000
       학생 ②(4학년) ID: TEST01-0011 / PW: 0000

    [첨부파일]
    1. 서비스 소개서
    2. 사용자별 퀵 가이드

    [운영 지원 자료]
    독서화랑 클래스를 더 자세히 살펴보실 수 있도록 소개 페이지를 함께 안내드립니다.
    - 독서화랑 클래스 다시 보기: https://linktr.ee/class_dmy

    [참고 : 이용 시 주의 사항]
    - 콘텐츠의 무단 복제 및 배포는 엄격히 금지됩니다.
    - 체험 종료 후 간단한 피드백에 협조 부탁드립니다.

    독서화랑 클래스가 선생님의 수업 준비에 실질적인 도움이 될 수 있도록 최선을 다하겠습니다.
    이용 중 궁금하신 점이나 도움이 필요하신 사항이 있으시면 언제든 편하게 말씀해 주세요.
    선생님의 학급에 즐거운 독서 변화가 시작되기를 응원합니다.
    감사합니다.

