# ---------------------------------------------------------------------
# 계약 ① 명단 받음 → 세팅 완료 안내   (둔내초 케이스)
# ---------------------------------------------------------------------
contract_setup_done:
  subject: "[독서화랑] {{sch}} 계정 세팅 완료 안내"
  body: |
    안녕하세요, {{sch}} {{tea}} 선생님!
    우리 아이들의 즐거운 독서 습관 형성을 돕는 독서화랑 클래스입니다.

    독서화랑 클래스를 믿고 도입해 주셔서 진심으로 감사드립니다.
    전달해주신 교사 및 학생 정보를 잘 확인하였으며,
    학생 {{n_student}}명, 교사 {{n_teacher}}명 계정 세팅을 완료하여 전달드립니다.

    [첨부파일]
    1. {{sch}}_계정정보_학생·교사명단_안내 (엑셀 파일)
    2. 사용자별 퀵 가이드

    첨부해드린 계정 정보로 로그인해 주시고, (초기 비밀번호는 '0000'입니다.)
    로그인 후 원하시는 비밀번호로 변경하여 사용하시면 됩니다.

    이용 중 궁금하신 점이나 도움이 필요하신 사항이 있으시면 언제든 편하게 말씀해 주세요.
    선생님과 학생들에게 즐거운 독서 활동 시간이 되기를 응원합니다.
    감사합니다.

# ---------------------------------------------------------------------
# 계약 ② 관리자만 있음 → 정규 개시 안내   (동화초 케이스)
# ---------------------------------------------------------------------
contract_admin:
  subject: "[독서화랑] {{sch}} 정규 서비스 개시 안내"
  body: |
    안녕하세요, {{sch}} {{tea}} 선생님!
    우리 아이들의 즐거운 독서 습관 형성을 돕는 독서화랑 클래스입니다.

    독서화랑 클래스를 믿고 도입해 주셔서 진심으로 감사드립니다.
    바로 이용하실 수 있도록 정규 서비스 접속 정보와 운영 지원 문서를 아래와 같이 안내드립니다.

    [서비스 접속 정보]
    1. 이용 기간: {{s_str}} ~ {{e_str}}
    2. 접속 주소: https://school.dmy.co.kr/
    3. 관리자 계정: {{adm_id}}
    4. 초기 비밀번호: {{adm_pw}} (보안을 위해 첫 접속 후 변경을 권장드립니다.)

    관리 선생님께서는 해당 계정으로 선생님·학생 정보를 관리하시고,
    각 선생님의 반 배정을 설정하실 수 있습니다.
    전달해주신 명단 인원({{n_total}}명) 세팅을 완료하였습니다.

    [첨부파일]
    1. {{sch}}_계정정보_학생·교사명단_안내 (엑셀 파일)
    2. 사용자별 퀵 가이드: 관리 선생님용 / 일반 선생님용 / 학생용

    [운영 지원 자료]
    - 상세 매뉴얼 및 자료 다운로드: https://drive.google.com/drive/folders/1EOoPtolllNWbUgst_ki8hv-purrh3to0
    - 학운위 체크리스트 다운로드: https://drive.google.com/file/d/1Prg8hOxVQ396BDREX1OAvtJBi0flTExF

    이용 중 궁금하신 점이나 도움이 필요하신 사항이 있으시면 언제든 편하게 말씀해 주세요.
    선생님의 학급에 즐거운 독서 변화가 시작되기를 응원합니다.
    감사합니다.

